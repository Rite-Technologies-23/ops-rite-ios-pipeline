name: "Setup iOS Build Environment"
description: >-
  Shared setup for every CI job: resolves and checks out the pipeline repo (for
  tool configs and scripts), selects Xcode, detects the workspace/project and
  scheme, restores SPM/CocoaPods/DerivedData caches, and installs only the CLI
  tools the calling job actually needs.

inputs:
  xcode_version:
    required: false
    default: "latest-stable"
    description: "Xcode version to select, or latest-stable to keep the runner default"

  workspace:
    required: false
    default: ""
    description: "Path to .xcworkspace. Auto-detected when empty."

  project:
    required: false
    default: ""
    description: "Path to .xcodeproj. Auto-detected when empty."

  scheme:
    required: false
    default: ""
    description: "Xcode scheme. Auto-detected when empty."

  tools:
    required: false
    default: ""
    description: >-
      Space-separated CLI tools to install: swiftlint swiftformat periphery
      xcbeautify gitleaks trivy. Only install what the job needs -- each one
      costs runner minutes.

  resolve_dependencies:
    required: false
    default: "true"
    description: "Run xcodebuild -resolvePackageDependencies and pod install"

  cache_key_suffix:
    required: false
    default: "shared"
    description: "Distinguishes DerivedData cache entries between jobs"

  cache_derived_data:
    required: false
    default: "false"
    description: >-
      Cache DerivedData for this job. Worth it for jobs that compile; wasteful
      for lint-only jobs.

  fetch_pipeline:
    required: false
    default: "true"
    description: "Check out this pipeline repo into .pipeline for configs and scripts"

  pipeline_token:
    required: false
    default: ""
    description: >-
      Token used to check out the pipeline repo. Only needed when the pipeline
      repo is PRIVATE and the caller lives in a different repo -- the default
      GITHUB_TOKEN is scoped to the caller repo and will 403.

  checkout_hl7core:
    required: false
    default: "false"
    description: >-
      Fetch Hl7Core's generated hl7Core/swiftpackage fresh for this job and
      stage it as a sibling directory of the caller checkout (one level above
      $GITHUB_WORKSPACE), for callers whose Xcode project has a LOCAL Swift
      package reference to it (e.g. mobrite_pill_counter_ios, relativePath
      ../../swiftpackage). Nothing is committed anywhere -- it's fetched fresh
      each run and removed again in cleanup_hl7core before the runner is torn
      down. Without this, xcodebuild can't even list schemes -- it tries to
      resolve the package graph to do so, and the local path doesn't exist on
      a fresh runner.

  hl7core_repo:
    required: false
    default: "Rite-Technologies-23/mobrite_hl7_parser_builder"
    description: "Repo that publishes the generated hl7Core/swiftpackage, used when checkout_hl7core is true."

  hl7core_ref:
    required: false
    default: "main"
    description: "Ref of hl7core_repo to check out."

  hl7core_token:
    required: false
    default: ""
    description: >-
      Token to check out hl7core_repo when private. Falls back to
      pipeline_token, then the default GITHUB_TOKEN.

outputs:
  pipeline_dir:
    description: "Directory the pipeline repo was checked out into"
    value: ${{ steps.resolve.outputs.dir }}

  project_type:
    description: "workspace or project"
    value: ${{ steps.detect.outputs.type }}

  project_file:
    description: "Path to the detected .xcworkspace or .xcodeproj"
    value: ${{ steps.detect.outputs.file }}

  scheme:
    description: "Resolved Xcode scheme"
    value: ${{ steps.detect.outputs.scheme }}

  dependency_manager:
    description: "spm, cocoapods, both, or none"
    value: ${{ steps.detect.outputs.dependency_manager }}

runs:
  using: "composite"
  steps:

    # ----------------------------------------------------------------------
    # github.repository is the CALLER inside a reusable workflow, so it can't
    # identify this pipeline. GITHUB_WORKFLOW_REF doesn't work either -- it
    # resolves to the top-level (caller's) workflow file, not the reusable
    # workflow currently executing, so parsing it previously checked out the
    # CALLER's own repo into .pipeline instead of this pipeline repo.
    # GITHUB_ACTION_REPOSITORY/GITHUB_ACTION_REF are set specifically to
    # identify the repo@ref of the action that's currently running -- this
    # composite action itself -- which is exactly what's needed here.
    # ----------------------------------------------------------------------
    - name: Resolve pipeline source
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        PIPELINE_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        PIPELINE_REF="${GITHUB_ACTION_REF:-}"

        if [ -z "$PIPELINE_REPO" ]; then
          PIPELINE_REPO="Rite-Technologies-23/ops-rite-ios-pipeline"
        fi
        if [ -z "$PIPELINE_REF" ]; then
          PIPELINE_REF="main"
        fi

        echo "repo=$PIPELINE_REPO" >> "$GITHUB_OUTPUT"
        echo "ref=$PIPELINE_REF"   >> "$GITHUB_OUTPUT"
        echo "dir=.pipeline"       >> "$GITHUB_OUTPUT"

        echo "Pipeline source: $PIPELINE_REPO@$PIPELINE_REF"

    - name: Checkout pipeline repo
      if: ${{ inputs.fetch_pipeline == 'true' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.resolve.outputs.repo }}
        ref: ${{ steps.resolve.outputs.ref }}
        path: ${{ steps.resolve.outputs.dir }}
        token: ${{ inputs.pipeline_token != '' && inputs.pipeline_token || github.token }}
        persist-credentials: false

    # ----------------------------------------------------------------------
    # Some callers (mobrite_pill_counter_ios) reference Hl7Core as a LOCAL
    # Swift package (relativePath ../../swiftpackage) rather than a remote
    # one, because Hl7Core's Package.swift lives at hl7Core/swiftpackage in
    # its repo, not at the repo root -- SPM's remote-package resolution can't
    # target a subdirectory, only a local path or a repo-root manifest. So we
    # reconstruct that same sibling layout on the runner: check out just the
    # generated hl7Core/swiftpackage folder and place it where the local
    # reference expects it, one directory above the caller's checkout. This
    # is fetched fresh every run and torn down by "Cleanup Hl7Core swiftpackage"
    # in the calling workflow -- nothing is ever committed anywhere.
    # ----------------------------------------------------------------------
    - name: Checkout Hl7Core Swift package
      id: checkout_hl7core
      if: ${{ inputs.checkout_hl7core == 'true' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.hl7core_repo }}
        ref: ${{ inputs.hl7core_ref }}
        # actions/checkout refuses any path outside $GITHUB_WORKSPACE, so this
        # checks out inside it (as a throwaway subfolder) and the next step
        # moves just the swiftpackage folder out to the sibling location with
        # a plain `mv`, which isn't subject to that restriction.
        path: hl7core-src
        sparse-checkout: |
          hl7Core/swiftpackage
        sparse-checkout-cone-mode: false
        token: ${{ inputs.hl7core_token != '' && inputs.hl7core_token || (inputs.pipeline_token != '' && inputs.pipeline_token || github.token) }}
        persist-credentials: false

    - name: Stage Hl7Core swiftpackage as a sibling package
      if: ${{ inputs.checkout_hl7core == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf ../swiftpackage
        mv hl7core-src/hl7Core/swiftpackage ../swiftpackage
        rm -rf hl7core-src
        echo "Staged Hl7Core swiftpackage at $(cd .. && pwd)/swiftpackage"

    - name: Select Xcode
      if: ${{ inputs.xcode_version != 'latest-stable' && runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail
        APP="/Applications/Xcode_${{ inputs.xcode_version }}.app"

        if [ ! -d "$APP" ]; then
          echo "::error::$APP not found. Available Xcode installs:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        fi

        sudo xcode-select -s "$APP/Contents/Developer"
        xcodebuild -version

    - name: Detect project, scheme and dependency manager
      id: detect
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_SCHEME: ${{ inputs.scheme }}
      run: bash "$GITHUB_ACTION_PATH/detect_project.sh"

    # ----------------------------------------------------------------------
    # Caching. SPM checkouts and Pods are keyed on their lockfiles; DerivedData
    # is keyed loosely and restored best-effort, because a stale-but-warm
    # DerivedData still saves most of a compile.
    # ----------------------------------------------------------------------
    - name: Cache Swift Package Manager
      if: ${{ runner.os == 'macOS' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Cache CocoaPods
      if: ${{ runner.os == 'macOS' }}
      uses: actions/cache@v4
      with:
        path: |
          Pods
          ~/Library/Caches/CocoaPods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Cache DerivedData
      if: ${{ runner.os == 'macOS' && inputs.cache_derived_data == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-dd-${{ inputs.cache_key_suffix }}-${{ hashFiles('**/Package.resolved', '**/Podfile.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-dd-${{ inputs.cache_key_suffix }}-${{ hashFiles('**/Package.resolved', '**/Podfile.lock') }}-
          ${{ runner.os }}-dd-${{ inputs.cache_key_suffix }}-

    - name: Install CLI tools
      if: ${{ inputs.tools != '' }}
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: bash "$GITHUB_ACTION_PATH/install_tools.sh"

    - name: Resolve dependencies
      if: ${{ inputs.resolve_dependencies == 'true' && runner.os == 'macOS' }}
      shell: bash
      env:
        PROJECT_TYPE: ${{ steps.detect.outputs.type }}
        PROJECT_FILE: ${{ steps.detect.outputs.file }}
        SCHEME: ${{ steps.detect.outputs.scheme }}
        DEPENDENCY_MANAGER: ${{ steps.detect.outputs.dependency_manager }}
      run: bash "$GITHUB_ACTION_PATH/resolve_dependencies.sh"
