# Reusable iOS CI. Runs for the caller's tag pushes and builds the unsigned
# Release archive that cd and the dSYM upload consume.
#
# 1. quality: lint and formatting.
# 2. security: secret, code and dependency checks.
# 3. dead_code, analyze: unused code and static analysis.
# 4. test: unit tests with coverage against coverage_threshold.
# 5. build: Release archive, uploaded as ios-archive-unsigned.
# 6. summary: collects every job result into the run summary.
#
# Gates (fail_on_*) are set by the caller; the defaults here are strict.

name: "iOS CI (Xcode) - Reusable"

on:
  workflow_call:
    inputs:

      xcode_version:
        required: false
        type: string
        default: "latest-stable"

      scheme:
        required: false
        type: string
        default: ""
        description: "Xcode scheme. Auto-detected from the project when empty."

      workspace:
        required: false
        type: string
        default: ""

      project:
        required: false
        type: string
        default: ""

      checkout_hl7core:
        required: false
        type: boolean
        default: false
        description: >-
          Fetch Hl7Core's generated swiftpackage fresh for each job and stage
          it as a sibling directory for callers with a LOCAL Swift package
          reference to it, then remove it again once the job's xcodebuild
          steps finish. See the setup-ios action's checkout_hl7core input.

      hl7core_repo:
        required: false
        type: string
        default: "Rite-Technologies-23/mobrite_hl7_parser_builder"

      hl7core_ref:
        required: false
        type: string
        default: "main"

      build_hl7core:
        required: false
        type: boolean
        default: false
        description: >-
          Build hl7Core/swiftpackage from source (Gradle) instead of checking out
          a committed copy. For when hl7core_ref no longer carries the folder.
          Only applies when checkout_hl7core is true.

      hl7core_java_version:
        required: false
        type: string
        default: "17"
        description: "JDK used to build Hl7Core when build_hl7core is true."

      configuration:
        required: false
        type: string
        default: "Release"

      coverage_threshold:
        required: false
        type: string
        default: "0"
        description: "Minimum LINE coverage %. 0 disables the gate."

      build_archive:
        required: false
        type: boolean
        default: true

      run_tests:
        required: false
        type: boolean
        default: true

      run_coverage:
        required: false
        type: boolean
        default: true

      run_static_analysis:
        required: false
        type: boolean
        default: true
        description: "SwiftLint. Previously a no-op placeholder; now a real gate."

      runner:
        required: false
        type: string
        default: macos-latest

      security_runner:
        required: false
        type: string
        default: ubuntu-latest
        description: >-
          The security stage needs no Xcode, so it defaults to a 1x-billed
          Linux runner instead of a 10x-billed macOS one.

      run_formatting:
        required: false
        type: boolean
        default: true

      run_dead_code:
        required: false
        type: boolean
        default: true
        description: "Periphery whole-project unused-declaration scan. Compiles the project."

      run_security:
        required: false
        type: boolean
        default: true

      run_dependency_audit:
        required: false
        type: boolean
        default: true

      run_clang_analyzer:
        required: false
        type: boolean
        default: false
        description: >-
          xcodebuild analyze. Off by default: it is a full extra compile on a
          10x runner and finds little in Swift-only codebases (the clang
          analyzer targets C/Objective-C).

      swift_warnings_as_errors:
        required: false
        type: boolean
        default: false
        description: >-
          Promote Swift/clang warnings to errors. Off by default because it
          breaks every build on an existing codebase until the backlog is cleared.

      swift_strict_concurrency:
        required: false
        type: string
        default: "targeted"
        description: "off | minimal | targeted | complete. 'complete' floods pre-Swift-6 code."

      test_destination:
        required: false
        type: string
        default: ""
        description: >-
          xcodebuild -destination. Auto-resolved to the newest available iPhone
          simulator (pinned by UDID) when empty.

      test_plan:
        required: false
        type: string
        default: ""
        description: "Optional -testPlan name."

      coverage_include_targets:
        required: false
        type: string
        default: ""
        description: "Regex of coverage targets to include. Empty means all non-test targets."

      coverage_exclude_targets:
        required: false
        type: string
        default: "([Tt]ests?|UITests|Mock|Fixture)"
        description: "Regex of coverage targets to exclude."

      fail_on_lint:
        required: false
        type: boolean
        default: true

      fail_on_formatting:
        required: false
        type: boolean
        default: true

      fail_on_security:
        required: false
        type: boolean
        default: true
        description: "Fail on Semgrep ERROR findings and leaked secrets."

      fail_on_vulnerabilities:
        required: false
        type: boolean
        default: false
        description: >-
          Fail on HIGH/CRITICAL CVEs in dependencies. Off by default: a first
          scan of an existing app almost always has findings.

      fail_on_dead_code:
        required: false
        type: boolean
        default: false
        description: >-
          Fail on unused declarations. Off by default: @objc, storyboards and
          SwiftUI previews produce false positives until retention is tuned.

      fail_on_clang_analyzer:
        required: false
        type: boolean
        default: false

    secrets:
      PIPELINE_TOKEN:
        required: false
        description: >-
          Only required when THIS pipeline repo is private and the caller lives
          in a different repo. A read-scoped PAT or GitHub App token; without it
          the checkout of the shared tool configs will fail with 403.

    outputs:
      coverage_percent:
        description: "Computed xccov LINE coverage percent"
        value: ${{ jobs.test.outputs.coverage_percent }}

      scheme:
        description: "The Xcode scheme that was built"
        value: ${{ jobs.test.outputs.scheme }}

env:
  SWIFTLINT_VERSION: "0.57.0"
  SWIFTFORMAT_VERSION: "0.55.5"
  PERIPHERY_VERSION: "3.0.0"
  XCBEAUTIFY_VERSION: "2.16.0"
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_VERSION: "0.74.0"
  SEMGREP_VERSION: "1.165.0"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality:
    name: Lint & Format
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_static_analysis || inputs.run_formatting }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS build environment
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/setup-ios@main
        with:
          xcode_version: ${{ inputs.xcode_version }}
          workspace: ${{ inputs.workspace }}
          project: ${{ inputs.project }}
          scheme: ${{ inputs.scheme }}
          pipeline_token: ${{ secrets.PIPELINE_TOKEN }}
          checkout_hl7core: ${{ inputs.checkout_hl7core }}
          hl7core_repo: ${{ inputs.hl7core_repo }}
          hl7core_ref: ${{ inputs.hl7core_ref }}
          build_hl7core: ${{ inputs.build_hl7core }}
          hl7core_java_version: ${{ inputs.hl7core_java_version }}
          hl7core_token: ${{ secrets.PIPELINE_TOKEN }}
          tools: swiftlint swiftformat
          resolve_dependencies: "false"
          cache_key_suffix: quality

      - name: Format check (SwiftFormat)
        if: ${{ inputs.run_formatting }}
        continue-on-error: ${{ !inputs.fail_on_formatting }}
        run: |
          set -euo pipefail
          mkdir -p build/reports

          CONFIG=".pipeline/.github/tool/.swiftformat"
          if [ -f ".swiftformat" ]; then
            echo "Using the caller repo's own .swiftformat"
            CONFIG=".swiftformat"
          fi

          swiftformat --lint --config "$CONFIG" --reporter github-actions-log . \
            2>&1 | tee build/reports/swiftformat.log

          COUNT=$(grep -c '::warning\|::error' build/reports/swiftformat.log 2>/dev/null || true)
          echo "SwiftFormat: ${COUNT:-0} file(s) would be reformatted" | tee build/reports/swiftformat-summary.txt

      - name: Formatting hint on failure
        if: ${{ failure() && inputs.run_formatting }}
        run: echo "::notice::Run 'swiftformat .' locally to fix formatting."

      - name: Lint (SwiftLint)
        if: ${{ inputs.run_static_analysis }}
        continue-on-error: ${{ !inputs.fail_on_lint }}
        run: |
          set -euo pipefail
          mkdir -p build/reports

          CONFIG=".pipeline/.github/tool/.swiftlint.yml"
          if [ -f ".swiftlint.yml" ]; then
            echo "Using the caller repo's own .swiftlint.yml"
            CONFIG=".swiftlint.yml"
          fi

          swiftlint lint --config "$CONFIG" --reporter json > build/reports/swiftlint.json || true
          swiftlint lint --config "$CONFIG" --reporter github-actions-logging --strict

      - name: Summarise lint findings
        if: ${{ always() && inputs.run_static_analysis }}
        run: |
          set -euo pipefail
          bash .pipeline/.github/tool/scripts/lint_summary.sh build/reports/swiftlint.json \
            | tee build/reports/swiftlint-summary.txt

      - name: Upload lint & format reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lint-format
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Hl7Core swiftpackage
        if: ${{ always() && inputs.checkout_hl7core }}
        shell: bash
        run: rm -rf ../swiftpackage


  security:
    name: Security Scan
    runs-on: ${{ inputs.security_runner }}
    if: ${{ inputs.run_security || inputs.run_dependency_audit }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pipeline configs
        uses: actions/checkout@v4
        with:
          repository: Rite-Technologies-23/ops-rite-ios-pipeline
          path: .pipeline
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}
          persist-credentials: false

      - name: Install security tools
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/ci-tools"
          mkdir -p "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"

          if [ "${{ inputs.run_security }}" = "true" ]; then
            curl -sSLo /tmp/gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C "$BIN" gitleaks
            chmod +x "$BIN/gitleaks"
          fi

          if [ "${{ inputs.run_dependency_audit }}" = "true" ]; then
            curl -sSLo /tmp/trivy.tar.gz \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            tar -xzf /tmp/trivy.tar.gz -C "$BIN" trivy
            chmod +x "$BIN/trivy"
          fi

      - name: Scan for committed secrets
        if: ${{ inputs.run_security }}
        continue-on-error: ${{ !inputs.fail_on_security }}
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .pipeline/.github/tool/gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact \
            --exit-code 1 \
            --verbose

      - name: Set up Python
        if: ${{ inputs.run_security }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        if: ${{ inputs.run_security }}
        run: python -m pip install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep (SAST)
        if: ${{ inputs.run_security }}
        run: |
          set -euo pipefail

          semgrep scan \
            --config r/swift \
            --config p/secrets \
            --config .pipeline/.github/tool/semgrep/ios-rules.yml \
            --exclude 'Pods' \
            --exclude 'Carthage' \
            --exclude '.build' \
            --exclude '.pipeline' \
            --exclude 'DerivedData' \
            --metrics=off \
            --json --output semgrep.json \
            --no-error || true

          test -f semgrep.json || echo '{"results":[],"errors":[]}' > semgrep.json

      - name: Gate on Semgrep ERROR findings
        if: ${{ inputs.run_security }}
        continue-on-error: ${{ !inputs.fail_on_security }}
        run: |
          set -euo pipefail

          ERRORS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          WARNS=$(jq  '[.results[] | select(.extra.severity == "WARNING")] | length' semgrep.json)

          echo "Semgrep: ${ERRORS} error(s), ${WARNS} warning(s)"

          if [ "$ERRORS" -gt 0 ]; then
            jq -r '.results[] | select(.extra.severity == "ERROR")
                   | "::error file=\(.path),line=\(.start.line)::[\(.check_id)] \(.extra.message | gsub("\n"; " "))"' \
                   semgrep.json
            exit 1
          fi

      - name: Scan dependencies for known CVEs
        if: ${{ inputs.run_dependency_audit }}
        continue-on-error: ${{ !inputs.fail_on_vulnerabilities }}
        run: |
          set -euo pipefail

          if ! find . -name 'Package.resolved' -o -name 'Podfile.lock' | grep -q .; then
            echo "::warning::No Package.resolved or Podfile.lock found -- nothing to audit."
            echo '{"Results":[]}' > trivy.json
            exit 0
          fi

          trivy fs . \
            --scanners vuln \
            --skip-dirs .pipeline,DerivedData,.build \
            --format json --output trivy.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0

          trivy fs . \
            --scanners vuln \
            --skip-dirs .pipeline,DerivedData,.build \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 0

          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy.json)
          echo "Trivy: ${COUNT} HIGH/CRITICAL vulnerabilities"

          if [ "$COUNT" -gt 0 ]; then
            exit 1
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-security
          path: |
            semgrep.json
            gitleaks.sarif
            trivy.json
          if-no-files-found: ignore
          retention-days: 30


  dead_code:
    name: Dead Code Analysis
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_dead_code }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS build environment
        id: setup
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/setup-ios@main
        with:
          xcode_version: ${{ inputs.xcode_version }}
          workspace: ${{ inputs.workspace }}
          project: ${{ inputs.project }}
          scheme: ${{ inputs.scheme }}
          pipeline_token: ${{ secrets.PIPELINE_TOKEN }}
          checkout_hl7core: ${{ inputs.checkout_hl7core }}
          hl7core_repo: ${{ inputs.hl7core_repo }}
          hl7core_ref: ${{ inputs.hl7core_ref }}
          build_hl7core: ${{ inputs.build_hl7core }}
          hl7core_java_version: ${{ inputs.hl7core_java_version }}
          hl7core_token: ${{ secrets.PIPELINE_TOKEN }}
          tools: periphery
          cache_derived_data: "true"
          cache_key_suffix: deadcode

      - name: Stage Periphery config
        run: |
          set -euo pipefail
          if [ ! -f ".periphery.yml" ]; then
            cp .pipeline/.github/tool/.periphery.yml ./.periphery.yml
            echo "Using the pipeline's shared Periphery config"
          else
            echo "Using the caller repo's own .periphery.yml"
          fi

      - name: Scan for unused declarations (Periphery)
        continue-on-error: ${{ !inputs.fail_on_dead_code }}
        env:
          PROJECT_TYPE: ${{ steps.setup.outputs.project_type }}
          PROJECT_FILE: ${{ steps.setup.outputs.project_file }}
          SCHEME: ${{ steps.setup.outputs.scheme }}
        run: |
          set -euo pipefail
          mkdir -p build/reports

          PROJ="$PROJECT_FILE"
          if [ "$PROJECT_TYPE" = "workspace" ]; then
            PROJ=$(find . -name '*.xcodeproj' \
                     -not -path '*/Pods/*' \
                     -not -path '*/.build/*' \
                     -not -path '*/.pipeline/*' \
                     -not -path '*/SourcePackages/*' 2>/dev/null | head -1 || true)
            if [ -z "$PROJ" ]; then
              echo "::error::Periphery needs an .xcodeproj; none found alongside $PROJECT_FILE"
              exit 1
            fi
          fi

          echo "Periphery scanning $PROJ (scheme $SCHEME)"

          periphery scan \
            --project "$PROJ" \
            --schemes "$SCHEME" \
            --format json \
            --disable-update-check \
            --quiet > build/reports/periphery.json || true

          test -s build/reports/periphery.json || echo '[]' > build/reports/periphery.json

          COUNT=$(jq 'length' build/reports/periphery.json)
          echo "Periphery found ${COUNT} unused declaration(s)"

          if [ "${{ inputs.fail_on_dead_code }}" = "true" ] && [ "$COUNT" -gt 0 ]; then
            jq -r '.[] | "::warning file=\(.location // "?" | split(":")[0]),line=\(.location // "0:0:0" | split(":")[1])::Unused \(.kind // "declaration"): \(.name // "?")"' \
              build/reports/periphery.json || true
            exit 1
          fi

      - name: Summarise dead-code findings
        if: always()
        run: |
          set -euo pipefail
          bash .pipeline/.github/tool/scripts/periphery_summary.sh build/reports/periphery.json \
            | tee build/reports/periphery-summary.txt

      - name: Upload dead-code reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dead-code
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Hl7Core swiftpackage
        if: ${{ always() && inputs.checkout_hl7core }}
        shell: bash
        run: rm -rf ../swiftpackage


  analyze:
    name: Clang Static Analyzer
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_clang_analyzer }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS build environment
        id: setup
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/setup-ios@main
        with:
          xcode_version: ${{ inputs.xcode_version }}
          workspace: ${{ inputs.workspace }}
          project: ${{ inputs.project }}
          scheme: ${{ inputs.scheme }}
          pipeline_token: ${{ secrets.PIPELINE_TOKEN }}
          checkout_hl7core: ${{ inputs.checkout_hl7core }}
          hl7core_repo: ${{ inputs.hl7core_repo }}
          hl7core_ref: ${{ inputs.hl7core_ref }}
          build_hl7core: ${{ inputs.build_hl7core }}
          hl7core_java_version: ${{ inputs.hl7core_java_version }}
          hl7core_token: ${{ secrets.PIPELINE_TOKEN }}
          tools: xcbeautify
          cache_derived_data: "true"
          cache_key_suffix: analyze

      - name: Run xcodebuild analyze
        continue-on-error: ${{ !inputs.fail_on_clang_analyzer }}
        env:
          SWIFT_WARNINGS_AS_ERRORS: ${{ inputs.swift_warnings_as_errors }}
          SWIFT_STRICT_CONCURRENCY: ${{ inputs.swift_strict_concurrency }}
        run: |
          set -euo pipefail
          mkdir -p build/reports build/analyzer

          STRICT=()
          while IFS= read -r line; do
            STRICT+=("$line")
          done < <(bash .pipeline/.github/tool/scripts/xcodebuild_flags.sh)

          set -o pipefail
          xcodebuild analyze \
            -"${{ steps.setup.outputs.project_type }}" "${{ steps.setup.outputs.project_file }}" \
            -scheme "${{ steps.setup.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR="$PWD/build/analyzer" \
            "${STRICT[@]+"${STRICT[@]}"}" \
            | xcbeautify

      - name: Summarise analyzer findings
        if: always()
        run: |
          set -euo pipefail
          COUNT=$(find build/analyzer -name '*.plist' 2>/dev/null | wc -l | tr -d ' ')
          echo "Clang analyzer: ${COUNT} finding(s)" | tee build/reports/analyze-summary.txt

          if [ "${{ inputs.fail_on_clang_analyzer }}" = "true" ] && [ "${COUNT:-0}" -gt 0 ]; then
            exit 1
          fi

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-analyzer
          path: |
            build/reports/
            build/analyzer/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Hl7Core swiftpackage
        if: ${{ always() && inputs.checkout_hl7core }}
        shell: bash
        run: rm -rf ../swiftpackage


  test:
    name: Unit Tests & Coverage
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.run_tests }}

    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}
      scheme: ${{ steps.setup.outputs.scheme }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS build environment
        id: setup
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/setup-ios@main
        with:
          xcode_version: ${{ inputs.xcode_version }}
          workspace: ${{ inputs.workspace }}
          project: ${{ inputs.project }}
          scheme: ${{ inputs.scheme }}
          pipeline_token: ${{ secrets.PIPELINE_TOKEN }}
          checkout_hl7core: ${{ inputs.checkout_hl7core }}
          hl7core_repo: ${{ inputs.hl7core_repo }}
          hl7core_ref: ${{ inputs.hl7core_ref }}
          build_hl7core: ${{ inputs.build_hl7core }}
          hl7core_java_version: ${{ inputs.hl7core_java_version }}
          hl7core_token: ${{ secrets.PIPELINE_TOKEN }}
          tools: xcbeautify
          cache_derived_data: "true"
          cache_key_suffix: test

      - name: Resolve simulator destination
        id: destination
        run: bash .pipeline/.github/tool/scripts/resolve_destination.sh "${{ inputs.test_destination }}"

      - name: Run Unit Tests
        env:
          SWIFT_WARNINGS_AS_ERRORS: ${{ inputs.swift_warnings_as_errors }}
          SWIFT_STRICT_CONCURRENCY: ${{ inputs.swift_strict_concurrency }}
        run: |
          set -euo pipefail
          mkdir -p build/reports

          RESULT_BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          echo "RESULT_BUNDLE=$RESULT_BUNDLE" >> "$GITHUB_ENV"
          rm -rf "$RESULT_BUNDLE"

          STRICT=()
          while IFS= read -r line; do
            STRICT+=("$line")
          done < <(bash .pipeline/.github/tool/scripts/xcodebuild_flags.sh)

          EXTRA=()
          if [ -n "${{ inputs.test_plan }}" ]; then
            EXTRA+=("-testPlan" "${{ inputs.test_plan }}")
          fi

          set -o pipefail
          xcodebuild test \
            -"${{ steps.setup.outputs.project_type }}" "${{ steps.setup.outputs.project_file }}" \
            -scheme "${{ steps.setup.outputs.scheme }}" \
            -destination "${{ steps.destination.outputs.destination }}" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -enableCodeCoverage YES \
            "${EXTRA[@]+"${EXTRA[@]}"}" \
            "${STRICT[@]+"${STRICT[@]}"}" \
            | xcbeautify --report junit --report-path build/reports

      - name: Compute coverage and gate
        id: coverage
        if: ${{ inputs.run_coverage }}
        run: |
          set -euo pipefail
          mkdir -p build/reports

          bash .pipeline/.github/tool/scripts/coverage_summary.sh \
            --result "$RESULT_BUNDLE" \
            --threshold "${{ inputs.coverage_threshold }}" \
            --include-pattern "${{ inputs.coverage_include_targets }}" \
            --exclude-pattern "${{ inputs.coverage_exclude_targets }}" \
            | tee build/reports/coverage-summary.txt

      - name: Summarise test results
        if: always()
        run: |
          set -euo pipefail
          bash .pipeline/.github/tool/scripts/junit_summary.sh build/reports \
            | tee build/reports/test-summary.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Hl7Core swiftpackage
        if: ${{ always() && inputs.checkout_hl7core }}
        shell: bash
        run: rm -rf ../swiftpackage


  build:
    name: Build Unsigned Archive
    runs-on: ${{ inputs.runner }}
    needs: [test]
    if: ${{ always() && inputs.build_archive && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS build environment
        id: setup
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/setup-ios@main
        with:
          xcode_version: ${{ inputs.xcode_version }}
          workspace: ${{ inputs.workspace }}
          project: ${{ inputs.project }}
          scheme: ${{ inputs.scheme }}
          pipeline_token: ${{ secrets.PIPELINE_TOKEN }}
          checkout_hl7core: ${{ inputs.checkout_hl7core }}
          hl7core_repo: ${{ inputs.hl7core_repo }}
          hl7core_ref: ${{ inputs.hl7core_ref }}
          build_hl7core: ${{ inputs.build_hl7core }}
          hl7core_java_version: ${{ inputs.hl7core_java_version }}
          hl7core_token: ${{ secrets.PIPELINE_TOKEN }}
          tools: xcbeautify
          cache_derived_data: "true"
          cache_key_suffix: archive

      - name: Build Unsigned Archive
        env:
          SWIFT_WARNINGS_AS_ERRORS: ${{ inputs.swift_warnings_as_errors }}
          SWIFT_STRICT_CONCURRENCY: ${{ inputs.swift_strict_concurrency }}
        run: |
          set -euo pipefail
          mkdir -p artifact

          ARCHIVE_PATH="artifact/ios-archive-unsigned.xcarchive"

          STRICT=()
          while IFS= read -r line; do
            STRICT+=("$line")
          done < <(bash .pipeline/.github/tool/scripts/xcodebuild_flags.sh)

          set -o pipefail
          xcodebuild archive \
            -"${{ steps.setup.outputs.project_type }}" "${{ steps.setup.outputs.project_file }}" \
            -scheme "${{ steps.setup.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            "${STRICT[@]+"${STRICT[@]}"}" \
            | xcbeautify

          echo "Archive contents:"
          ls -la "$ARCHIVE_PATH"

      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: artifact
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup Hl7Core swiftpackage
        if: ${{ always() && inputs.checkout_hl7core }}
        shell: bash
        run: rm -rf ../swiftpackage


  summary:
    name: CI Summary
    runs-on: ${{ inputs.security_runner }}
    needs: [quality, security, dead_code, analyze, test, build]
    if: ${{ always() }}

    steps:

      - name: Checkout pipeline scripts
        uses: actions/checkout@v4
        with:
          repository: Rite-Technologies-23/ops-rite-ios-pipeline
          path: .pipeline
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}
          persist-credentials: false

      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Compose job summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEAD_CODE_RESULT: ${{ needs.dead_code.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_PERCENT: ${{ needs.test.outputs.coverage_percent }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: bash .pipeline/.github/tool/scripts/generate_summary_md.sh reports
