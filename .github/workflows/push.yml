name: "iOS CI - Reusable (Xcode)"

on:
  workflow_call:
    inputs:
      xcode_version:
        required: false
        type: string
        default: "latest-stable"

      scheme:
        required: true
        type: string

      workspace:
        required: false
        type: string
        default: ""

      project:
        required: false
        type: string
        default: ""

      configuration:
        required: false
        type: string
        default: "Release"

      coverage_threshold:
        required: false
        type: string
        default: "0"

      build_archive:
        required: false
        type: boolean
        default: true

      run_tests:
        required: false
        type: boolean
        default: true

      run_coverage:
        required: false
        type: boolean
        default: true

      run_static_analysis:
        required: false
        type: boolean
        default: true

    outputs:
      coverage_percent:
        value: ${{ jobs.ci.outputs.coverage_percent }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: macos-latest

    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}

    steps:

      - uses: actions/checkout@v4

      # --------------------------------------------------
      # Detect workspace or project
      # --------------------------------------------------

      - name: Detect Xcode Workspace / Project
        id: detect
        run: |
          set -e

          if [ -n "${{ inputs.workspace }}" ] && [ -d "${{ inputs.workspace }}" ]; then
            echo "type=workspace" >> $GITHUB_OUTPUT
            echo "file=${{ inputs.workspace }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "${{ inputs.project }}" ] && [ -d "${{ inputs.project }}" ]; then
            echo "type=project" >> $GITHUB_OUTPUT
            echo "file=${{ inputs.project }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> $GITHUB_OUTPUT
            echo "file=$WORKSPACE" >> $GITHUB_OUTPUT
            echo "Detected workspace: $WORKSPACE"
            exit 0
          fi

          PROJECT=$(find . -name "*.xcodeproj" | head -n 1 || true)

          if [ -n "$PROJECT" ]; then
            echo "type=project" >> $GITHUB_OUTPUT
            echo "file=$PROJECT" >> $GITHUB_OUTPUT
            echo "Detected project: $PROJECT"
            exit 0
          fi

          echo "❌ No workspace or project found"
          exit 1

      # Optional Xcode version
      - name: Select Xcode
        if: ${{ inputs.xcode_version != 'latest-stable' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          xcodebuild -version

      # --------------------------------------------------
      # Resolve dependencies
      # --------------------------------------------------

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -${{ steps.detect.outputs.type }} "${{ steps.detect.outputs.file }}" \
            -scheme "${{ inputs.scheme }}" || true

      # --------------------------------------------------
      # Static analysis
      # --------------------------------------------------

      - name: Static Analysis
        if: ${{ inputs.run_static_analysis }}
        run: |
          echo "Static analysis placeholder"
          echo "Add SwiftLint / Sonar here"

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------

      - name: Run Unit Tests
        if: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail

          RESULT_BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          echo "RESULT_BUNDLE=$RESULT_BUNDLE" >> $GITHUB_ENV

          xcodebuild test \
            -${{ steps.detect.outputs.type }} "${{ steps.detect.outputs.file }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath "$RESULT_BUNDLE" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty

      # --------------------------------------------------
      # Coverage
      # --------------------------------------------------

      - name: Compute Coverage + Gate
        id: coverage
        if: ${{ inputs.run_tests && inputs.run_coverage }}
        run: |
          set -euo pipefail

          TH="${{ inputs.coverage_threshold }}"
          RESULT="${RESULT_BUNDLE:-}"

          if [ -z "$RESULT" ] || [ ! -d "$RESULT" ]; then
            echo "❌ xcresult not found"
            exit 1
          fi

          echo "Coverage targets:"
          xcrun xccov view --report "$RESULT"

          APP_NAME="${{ inputs.scheme }}.app"

          LINE=$(xcrun xccov view --report "$RESULT" | grep "$APP_NAME" | head -n 1 || true)

          if [ -z "$LINE" ]; then
            echo "❌ Could not find coverage line"
            exit 1
          fi

          PCT=$(echo "$LINE" | awk '{print $(NF-1)}' | tr -d '%')

          echo "coverage_percent=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${PCT}%"

          if awk -v th="$TH" 'BEGIN{exit !(th+0>0)}'; then
            PASS=$(awk -v p="$PCT" -v th="$TH" 'BEGIN { print (p+0 >= th+0) ? "1" : "0" }')
            if [ "$PASS" -ne 1 ]; then
              echo "❌ Coverage below threshold"
              exit 1
            fi
          fi

      # --------------------------------------------------
      # Archive
      # --------------------------------------------------

      - name: Build Unsigned Archive
        if: ${{ inputs.build_archive }}
        run: |
          set -euo pipefail

          mkdir -p release

          ARCHIVE_PATH="release/ios-archive-unsigned.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV

          xcodebuild archive \
            -${{ steps.detect.outputs.type }} "${{ steps.detect.outputs.file }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      # --------------------------------------------------
      # Artifacts
      # --------------------------------------------------

      - name: Upload Test Results
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ env.RESULT_BUNDLE }}

      - name: Prepare Archive
        if: ${{ inputs.build_archive }}
        run: |
          mkdir -p artifact
          mv release/ios-archive-unsigned.xcarchive artifact/

      - name: Upload Archive
        if: ${{ inputs.build_archive }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: artifact