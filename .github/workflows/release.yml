# Reusable iOS CD. Consumes ios-archive-unsigned from the caller's CI; never rebuilds.
#
# 1. sign_ios: exports the App Store IPA with the ios-export action.
#    Missing signing secrets skip it with a warning.
# 2. sign_ios_esper: exports the Esper IPA when deploy_to_esper is on.
# 3. create_release: always runs. Attaches whichever IPAs were signed.
# 4. deploy_testflight, deploy_esper: opt-in. Each is skipped with a warning
#    when its credentials are missing.

name: "Reusable iOS CD (Release)"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      deploy_to_testflight:
        required: false
        type: boolean
        default: false

      ios_bundle_id:
        required: true
        type: string

      deploy_to_esper:
        required: false
        type: boolean
        default: false

      esper_export_method:
        required: false
        type: string
        default: "ad-hoc"
        description: "Export method for the Esper IPA: development, ad-hoc or enterprise."

      esper_tenant:
        required: false
        type: string
        default: ""

      enable_whats_new:
        required: false
        type: boolean
        default: false

      whats_new_file:
        required: false
        type: string
        default: ""

      xcode_version:
        required: false
        type: string
        default: "latest-stable"

      scheme:
        required: false
        type: string
        default: ""

      workspace:
        required: false
        type: string
        default: ""

      project:
        required: false
        type: string
        default: ""

      configuration:
        required: false
        type: string
        default: "Release"

      coverage_threshold:
        required: false
        type: string
        default: "0"

      runner:
        required: false
        type: string
        default: macos-latest

      linux_runner:
        required: false
        type: string
        default: ubuntu-latest

    secrets:
      IOS_TEAM_ID:
        required: false
      IOS_CERT_P12_BASE64:
        required: false
      IOS_CERT_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false

      IOS_ESPER_CERT_P12_BASE64:
        required: false
      IOS_ESPER_CERT_PASSWORD:
        required: false
      IOS_ESPER_PROVISION_PROFILE_BASE64:
        required: false
      ESPER_API_KEY:
        required: false

      APPSTORE_ISSUER_ID:
        required: false
      APPSTORE_KEY_ID:
        required: false
      APPSTORE_PRIVATE_KEY:
        required: false

      PIPELINE_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: ios-cd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  sign_ios:
    name: Sign iOS & Export IPA
    runs-on: ${{ inputs.runner }}

    outputs:
      signed: ${{ steps.chk.outputs.ok }}

    steps:
      - name: Check signing secrets
        id: chk
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$P12" ] && [ -n "$P12_PWD" ] && [ -n "$PROFILE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing skipped: one or more of IOS_TEAM_ID, IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64 is not set. No IPA will be attached and TestFlight will be skipped."
          fi

      - name: Download unsigned iOS archive
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: archive

      - name: Export IPA (app-store)
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/ios-export@main
        with:
          p12_base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12_password: ${{ secrets.IOS_CERT_PASSWORD }}
          profile_base64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          team_id: ${{ secrets.IOS_TEAM_ID }}
          bundle_id: ${{ inputs.ios_bundle_id }}
          method: app-store
          archive: archive/ios-archive-unsigned.xcarchive

      - name: Upload signed IPA artifact
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-signed
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Remove signing keychain and profile
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi


  sign_ios_esper:
    name: Sign iOS for Esper
    if: ${{ inputs.deploy_to_esper }}
    runs-on: ${{ inputs.runner }}

    outputs:
      signed: ${{ steps.chk.outputs.ok }}

    steps:
      - name: Check Esper signing secrets
        id: chk
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          P12: ${{ secrets.IOS_ESPER_CERT_P12_BASE64 || secrets.IOS_CERT_P12_BASE64 }}
          P12_PWD: ${{ secrets.IOS_ESPER_CERT_PASSWORD || secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ESPER_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$P12" ] && [ -n "$P12_PWD" ] && [ -n "$PROFILE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Esper iOS deploy skipped: IOS_TEAM_ID, a signing certificate (IOS_ESPER_CERT_* or IOS_CERT_*) or IOS_ESPER_PROVISION_PROFILE_BASE64 is not set."
          fi

      - name: Download unsigned iOS archive
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: archive

      - name: Export IPA (Esper)
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/actions/ios-export@main
        with:
          p12_base64: ${{ secrets.IOS_ESPER_CERT_P12_BASE64 || secrets.IOS_CERT_P12_BASE64 }}
          p12_password: ${{ secrets.IOS_ESPER_CERT_PASSWORD || secrets.IOS_CERT_PASSWORD }}
          profile_base64: ${{ secrets.IOS_ESPER_PROVISION_PROFILE_BASE64 }}
          team_id: ${{ secrets.IOS_TEAM_ID }}
          bundle_id: ${{ inputs.ios_bundle_id }}
          method: ${{ inputs.esper_export_method }}
          archive: archive/ios-archive-unsigned.xcarchive

      - name: Rename Esper IPA
        if: ${{ steps.chk.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/export/*.ipa; do mv "$f" "${f%.ipa}-esper.ipa"; done

      - name: Upload Esper IPA artifact
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-esper
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Remove signing keychain and profile
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi


  # Runs even when a sign job is skipped; attaches whichever IPAs exist.
  create_release:
    name: Create GitHub Release
    needs: [sign_ios, sign_ios_esper]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ inputs.linux_runner }}

    outputs:
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed IPA
        if: ${{ needs.sign_ios.outputs.signed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-signed
          path: release/ios

      - name: Download Esper IPA
        if: ${{ needs.sign_ios_esper.outputs.signed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-esper
          path: release/ios

      - name: Determine next GitHub version
        id: version_check
        run: |
          set -euo pipefail
          BASE_VERSION="${{ inputs.version }}"

          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ inputs.version must be semver like 1.2.3"
            echo "You passed: '$BASE_VERSION'"
            exit 1
          fi

          git fetch --tags
          CURRENT_VERSION="$BASE_VERSION"

          while git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; do
            IFS='.' read -r major minor patch <<<"$CURRENT_VERSION"
            patch=$((patch + 1))
            CURRENT_VERSION="$major.$minor.$patch"
          done

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: Release ${{ steps.version_check.outputs.tag }}
          generate_release_notes: true
          files: release/ios/*.ipa
          token: ${{ secrets.GITHUB_TOKEN }}


  deploy_testflight:
    name: Deploy to TestFlight
    if: ${{ inputs.deploy_to_testflight && needs.sign_ios.outputs.signed == 'true' }}
    needs: sign_ios
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Check App Store Connect credentials
        id: chk
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -n "$ISSUER" ] && [ -n "$KEY_ID" ] && [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TestFlight deploy skipped: APPSTORE_ISSUER_ID, APPSTORE_KEY_ID or APPSTORE_PRIVATE_KEY is not set."
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.chk.outputs.ok == 'true' }}

      - name: Download signed IPA
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-signed
          path: release/ios

      - name: Setup Ruby
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install fastlane
        if: ${{ steps.chk.outputs.ok == 'true' }}
        run: gem install fastlane -N

      - name: Upload to TestFlight
        if: ${{ steps.chk.outputs.ok == 'true' }}
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          IPA=$(find release/ios -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "❌ No IPA found in release/ios"
            exit 1
          fi

          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > AuthKey.p8
          perl -pi -e 's/\r\n/\n/g' AuthKey.p8

          KEY_ESCAPED=$(python3 - <<'PY'
          import json
          p = open("AuthKey.p8", "r", encoding="utf-8").read()
          print(json.dumps(p)[1:-1])
          PY
          )

          cat > api_key.json <<EOF
          {
            "key_id": "${APPSTORE_KEY_ID}",
            "issuer_id": "${APPSTORE_ISSUER_ID}",
            "key": "${KEY_ESCAPED}",
            "in_house": false
          }
          EOF

          CHANGELOG=""
          if [ "${{ inputs.enable_whats_new }}" = "true" ]; then
            if [ -z "${{ inputs.whats_new_file }}" ] || [ ! -f "${{ inputs.whats_new_file }}" ]; then
              echo "❌ whats_new_file missing or not found"
              exit 1
            fi
            CHANGELOG="$(cat "${{ inputs.whats_new_file }}")"
          fi

          if [ -n "$CHANGELOG" ]; then
            fastlane pilot upload --ipa "$IPA" --api_key_path api_key.json --changelog "$CHANGELOG"
          else
            fastlane pilot upload --ipa "$IPA" --api_key_path api_key.json
          fi


  deploy_esper:
    name: Deploy to Esper
    if: ${{ inputs.deploy_to_esper && needs.sign_ios_esper.outputs.signed == 'true' }}
    needs: sign_ios_esper
    runs-on: ${{ inputs.linux_runner }}

    steps:
      - name: Check Esper configuration
        id: chk
        env:
          ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
          ESPER_TENANT: ${{ inputs.esper_tenant }}
        run: |
          if [ -n "$ESPER_API_KEY" ] && [ -n "$ESPER_TENANT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Esper deploy skipped: ESPER_API_KEY secret or esper_tenant input is empty."
          fi

      - name: Download Esper IPA
        if: ${{ steps.chk.outputs.ok == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-esper
          path: release/ios

      - name: Upload to Esper
        if: ${{ steps.chk.outputs.ok == 'true' }}
        env:
          ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
          ESPER_TENANT: ${{ inputs.esper_tenant }}
        run: |
          set -euo pipefail

          IPA=$(find release/ios -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::No Esper IPA found"
            exit 1
          fi

          HTTP_STATUS=$(curl -L -sS -w "%{http_code}" \
            -X POST "https://${ESPER_TENANT}-api.esper.cloud/api/v2/tenant-apps" \
            -H "Authorization: Bearer ${ESPER_API_KEY}" \
            -H "Accept: application/json" \
            -F "platform=APPLE" \
            -F "file=@${IPA}" \
            -o esper_ios_response.json)

          cat esper_ios_response.json || true
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Esper iOS upload failed"
            exit 1
          fi
